<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="1人用の業務日報 提出管理アプリ" />
    <title>業務日報 提出管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <p class="eyebrow">DAILY REPORT</p>
        <h1>業務日報 提出管理</h1>
        <p id="today-date" class="today-date" aria-live="polite"></p>
      </header>

      <section class="card today-card" aria-labelledby="today-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">TODAY</p>
            <h2 id="today-heading">今日の提出状況</h2>
          </div>
          <span id="today-badge" class="status-badge"></span>
        </div>
        <div id="today-content" class="today-content"></div>
      </section>

      <section class="card monthly-card" aria-labelledby="monthly-heading">
        <div class="monthly-top">
          <div>
            <p class="section-kicker">MONTHLY OVERVIEW</p>
            <h2 id="monthly-heading">月間提出状況</h2>
          </div>
          <label class="month-picker-label" for="month-picker">
            <span>表示する月</span>
            <input id="month-picker" type="month" />
          </label>
        </div>

        <div class="summary" aria-label="月間サマリー">
          <div class="summary-item">
            <span>営業日</span>
            <strong id="business-days-count">0日</strong>
          </div>
          <div class="summary-item">
            <span>提出済み</span>
            <strong id="submitted-days-count">0日</strong>
          </div>
          <div class="summary-item">
            <span>提出率</span>
            <strong id="submission-rate">—</strong>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">日付</th>
                <th scope="col">曜日</th>
                <th scope="col">提出状況</th>
                <th scope="col">提出時刻</th>
              </tr>
            </thead>
            <tbody id="monthly-table-body"></tbody>
          </table>
        </div>
        <p class="table-note">未提出の過去営業日は「登録」から提出済みにできます。</p>
      </section>
    </main>
    <script src="app.js?v=20260816-2"></script>
  </body>
</html>
