<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="1人用の業務日報提出状況管理アプリ" />
  <title>業務日報 提出管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    <header class="page-header">
      <p class="eyebrow">DAILY REPORT</p>
      <h1>業務日報 提出管理</h1>
      <p id="today-date" class="today-date" aria-live="polite"></p>
    </header>

    <section class="card today-card" aria-labelledby="today-heading">
      <div class="section-heading">
        <div>
          <p class="section-label">TODAY</p>
          <h2 id="today-heading">今日の提出状況</h2>
        </div>
      </div>
      <div id="today-status" class="today-status" aria-live="polite"></div>
      <button id="submit-button" class="submit-button" type="button">日報を提出済みにする</button>
      <p id="weekend-message" class="weekend-message" hidden>本日は営業日ではありません</p>
    </section>

    <section class="card monthly-card" aria-labelledby="monthly-heading">
      <div class="monthly-top">
        <div>
          <p class="section-label">MONTHLY</p>
          <h2 id="monthly-heading">月間提出状況</h2>
        </div>
        <label class="month-picker">
          <span>表示する月</span>
          <input id="month-input" type="month" aria-label="表示する月" />
        </label>
      </div>

      <div class="summary" aria-label="月間サマリー">
        <div class="summary-item"><span>営業日</span><strong id="business-days">0日</strong></div>
        <div class="summary-item"><span>提出済み</span><strong id="submitted-days">0日</strong></div>
        <div class="summary-item"><span>提出率</span><strong id="submission-rate">0%</strong></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>日付</th><th>曜日</th><th>提出状況</th><th>提出時刻</th></tr>
          </thead>
          <tbody id="monthly-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
